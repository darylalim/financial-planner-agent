# Streamlit's own defaults, corrected for an app that holds a household's
# finances and has no authentication of any kind.

[server]
# Unset, server.address is "0.0.0.0" -- Streamlit binds the dual-stack wildcard
# and prints a Network URL. Everything this app guards would then be reachable
# from any device on the same network: the sidebar's list of statement
# filenames, a chat session over those documents, a write path into
# agent_home/workspace/, and spend on the owner's API key. The agent's own
# defences -- virtual_mode, the checkpoint DB kept outside AGENT_HOME, redact()
# -- all assume the attacker arrived inside an uploaded document, not over TCP.
#
# README's "single-user by design" is a scaling limit stated in prose; this is
# the line that enforces it. A CLI --server.address still wins, and this file is
# only read when `streamlit run` is invoked from the repo root -- which is the
# command README's Quickstart and CLAUDE.md both give.
#
# Not "::1": _bind_socket picks AF_INET6 for any address containing a colon, and
# ::1 is not the v6 wildcard, so IPv4 loopback would stop resolving.
address = "127.0.0.1"

# An empty allowedHosts accepts any Host header, so a hostile page that resolves
# its own name to 127.0.0.1 reaches a loopback-bound app as same-origin.
allowedHosts = ["localhost", "127.0.0.1"]

# Theme: one teal accent, mirrored between light and dark. Colours live per mode;
# shape and type are shared. Both modes are defined so the viewer can switch in the
# settings menu. No web fonts: the bundled sans and mono keep the page from calling
# Google Fonts, which would leak each visit to a personal finance app. Every text
# pair is held to WCAG AA by tests/test_app.py::TestStreamlitConfig, which computes
# contrast from the colours below -- a change that drops one under 4.5:1 fails the gate.

[theme]
font = "sans-serif"
codeFont = "monospace"
baseRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false

[theme.light]
primaryColor = "#0F766E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F4"
textColor = "#14201F"
linkColor = "#0F766E"
borderColor = "#D3DCDA"
codeBackgroundColor = "#EDF2F1"
grayColor = "#56645F"
redColor = "#B42318"
redBackgroundColor = "#FEF3F2"
redTextColor = "#B42318"
orangeColor = "#B54708"
orangeBackgroundColor = "#FFF6ED"
orangeTextColor = "#B54708"
yellowColor = "#A15C07"
yellowBackgroundColor = "#FEFBE8"
yellowTextColor = "#A15C07"
greenColor = "#067647"
greenBackgroundColor = "#ECFDF3"
greenTextColor = "#067647"
blueColor = "#175CD3"
blueBackgroundColor = "#EFF4FF"
blueTextColor = "#175CD3"
violetColor = "#6941C6"

[theme.light.sidebar]
