[project]
name = "financial-planner-agent"
version = "0.1.0"
description = "Personal financial planning agent built on Deep Agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Agent harness — pulls langchain, langchain-core, langchain-anthropic,
    # langgraph and langsmith transitively.
    "deepagents>=0.7.3",
    # Chat UI
    "streamlit>=1.57",
    # Market data (no API key required)
    "yfinance>=0.2.55",
    # Web search
    "tavily-python>=0.5.0",
    # Document ingestion
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pypdf>=5.1",
    # Config
    "python-dotenv>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/financial_planner"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
